name: iOS release build

# Manually triggered: run this once the Apple Developer account, signing
# certificate, and provisioning profile are ready (see the repo secrets
# listed below). Builds a signed .ipa on a hosted macOS runner (Xcode only
# runs on macOS, and this repo is normally developed from Windows/WSL) and
# uploads it to TestFlight / App Store Connect.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_CERTIFICATE_P12_BASE64   -- Distribution cert exported as .p12, base64-encoded
#   APPLE_CERTIFICATE_PASSWORD     -- password for that .p12
#   APPLE_PROVISIONING_PROFILE_BASE64 -- App Store provisioning profile, base64-encoded
#   APPSTORE_ISSUER_ID             -- App Store Connect API key issuer ID
#   APPSTORE_KEY_ID                -- App Store Connect API key ID
#   APPSTORE_PRIVATE_KEY           -- App Store Connect API private key (.p8 contents)
#
# None of these exist yet -- add them once the Apple Developer account and
# its certificates/keys are created, then run this workflow from the
# Actions tab (workflow_dispatch).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps and build the web app
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Import signing certificate + provisioning profile
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath build/App.xcarchive -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual clean archive

      - name: Export .ipa
        working-directory: ios/App
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa

      - name: Upload to App Store Connect / TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          xcrun altool --upload-app -f ios/App/build/ipa/App.ipa -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-output
          path: ios/App/build/ipa/*.ipa
