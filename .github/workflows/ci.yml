name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web deps
        run: npm ci

      - name: Install server deps
        run: npm ci --prefix server

      - name: Typecheck
        run: npm run lint

      - name: Server tests
        run: npm test

      - name: Production build
        run: npm run build
