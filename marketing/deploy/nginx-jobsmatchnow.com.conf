server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jobsmatchnow.com;

    ssl_certificate /etc/letsencrypt/live/jobsmatchnow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobsmatchnow.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/jobmatchsnow.work/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|ico|woff2|webmanifest)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jobsmatchnow.com;

    ssl_certificate /etc/letsencrypt/live/jobsmatchnow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobsmatchnow.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://jobsmatchnow.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name jobsmatchnow.com www.jobsmatchnow.com;

    return 301 https://jobsmatchnow.com$request_uri;
}
